 try{

 }catch(e){toast(e.message)}

 p.innerHTML=`${$('#scene').innerHTML}<h1>${reg?'Join Zivo':'Welcome back'}</h1><p class=m>${reg?'Choose Rider to book trips, or Driver to accept them.':'Log in to book or accept rides.'}</p>${reg?'<input id=n placeholder="Full name" maxlength=60>':''}<input id=e type=email placeholder="Email"><input id=p type=password placeholder="Password (8+ characters)">${reg?'<div class=seg><label><input type=radio name=r value=RIDER checked> Rider</label><label><input type=radio name=r value=DRIVER> Driver</label></div>':''}${reg?'<p class=m>By creating an account you agree to the <a href=/terms.html target=_blank rel=noopener>Terms</a> and <a href=/privacy.html target=_blank rel=noopener>Privacy Policy</a>.</p>':''}<button id=go>${reg?'Create account':'Log in'}</button><p class=m><a id=sw>${reg?'Have an account? Log in':'New here? Create an account'}</a></p><p class=m><a href=/privacy.html target=_blank rel=noopener>Privacy</a> · <a href=/terms.html target=_blank rel=noopener>Terms</a></p>`;
 $('#sw').onclick=()=>authView(!reg);
 $('#go').onclick=()=>{const b={email:$('#e').value,password:$('#p').value};if(reg){b.name=$('#n').value;b.role=document.querySelector('[name=r]:checked').value}
  api('/auth/'+(reg?'register':'login'),'POST',b).then(j=>{T=j.token;U=j.user;sessionStorage.t=T;sessionStorage.u=JSON.stringify(U);location.reload()}).catch(e=>toast(e.message))}}
// ---------- map helpers ----------
const nm=async(la,ln)=>{const f=la.toFixed(4)+', '+ln.toFixed(4);try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${la}&lon=${ln}`)).json();return(j.display_name||'').split(',').slice(0,2).join(',')||f}catch{return f}};
async function rt(a,b){const k=a+'|'+b;if(rc[k])return rc[k];try{const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`)).json();return rc[k]=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]])}catch{return[a,b]}}
async function draw(){let a,b;if(S.act){a=[S.act.pLat,S.act.pLng];b=[S.act.dLat,S.act.dLng]}else if(U.role=='RIDER'){a=S.pick;b=S.drop}
 const line=a&&b?await rt(a,b):null;lay.clearLayers();if(line)L.polyline(line,{color:'#ff8a3d',weight:5,opacity:.85}).addTo(lay);
 if(a)dot(a,'#ff8a3d');if(b)dot(b,'#e11d74');if(U.role=='DRIVER')S.reqs.forEach(r=>dot([r.pLat,r.pLng],'#ffd0a8'));
 const cp=U.role=='DRIVER'?S.me:(S.drv&&S.drv.lat?[S.drv.lat,S.drv.lng]:null);
 if(cp){if(!DM)DM=L.marker(cp,{icon:L.divIcon({className:'drv',html:'<span></span>',iconSize:[22,22]}),interactive:false}).addTo(map);else DM.setLatLng(cp)}else if(DM){DM.remove();DM=null}
 if(!S.act)S.lastKey='';const key=S.act?S.act.id+S.act.status:'';
 if(key&&key!=S.lastKey&&cp){S.lastKey=key;map.fitBounds([cp,S.act.status=='STARTED'?[S.act.dLat,S.act.dLng]:[S.act.pLat,S.act.pLng]],{padding:[110,110],maxZoom:16})}}
function setPt(p,n){S[S.mode]=p;S[S.mode+'N']=n;if(S.mode=='pick')S.mode='drop';est()}
async function est(){S.est=null;if(S.pick&&S.drop){try{S.est=await api('/rides/estimate','POST',{pLat:S.pick[0],pLng:S.pick[1],dLat:S.drop[0],dLng:S.drop[1]});map.fitBounds([S.pick,S.drop],{padding:[100,100]})}catch(e){toast(e.message)}}render();draw()}
async function search(q){try{const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();if(!j[0])return toast('Place not found');const p=[+j[0].lat,+j[0].lon];map.setView(p,14);setPt(p,j[0].display_name.split(',').slice(0,2).join(','))}catch{toast('Search unavailable')}}
map.on('click',async e=>{if(!U||S.act)return;const p=[e.latlng.lat,e.latlng.lng];if(U.role=='RIDER')setPt(p,await nm(...p));if(U.role=='DRIVER'){S.me=p;api('/driver/status','POST',{lat:p[0],lng:p[1]}).then(draw).catch(e=>toast(e.message))}});
// ---------- rider ----------
function ride(a){return`<div class=m>Ride #${a.id} · ${fmt(a.created)}</div><div class=st>${LAB[a.status]}</div><div class=bar>${ORD.map((s,i)=>`<b class="${i<=ORD.indexOf(a.status)?'on':''}"></b>`).join('')}</div><div class=pt><i style=background:#ff8a3d></i>${esc(a.pickup)}</div><div class=pt><i style=background:#e11d74></i>${esc(a.drop)}</div><div class=big>₹${a.fare}<small>${a.distanceKm} km</small></div>${a.status=='COMPLETED'?`<div class=h><span>${a.paid?'Paid':'Amount due'}</span><span>₹${a.fare}</span></div>`:''}`}
const hist=()=>S.mine.length?'<h3>Recent rides</h3>'+S.mine.slice(0,4).map(r=>`<div class=h><span>${esc(r.drop)}</span><span>${fmt(r.created)} · ${U.role=='DRIVER'&&r.status=='COMPLETED'?'You earn ₹'+r.earning+(r.paid?' (paid)':' (awaiting payment)'):'₹'+r.fare+' · '+r.status}</span></div>`).join(''):'';
function rider(){const a=S.act;
 if(a){let b;if(a.status=='COMPLETED')b=!a.paid?`<button onclick="payRide(${a.id})">Pay ₹${a.fare}</button>`:`<p class=m style="width:100%">Rate your driver</p>${[1,2,3,4,5].map(n=>`<button class=s onclick="rateRide(${a.id},${n})">${n}★</button>`).join('')}<button class=s onclick="S.skip.add(${a.id});tick()">Skip</button>`;
  else b=(a.status!='STARTED'?`<button class=d onclick="act('/rides/${a.id}/cancel')">Cancel</button>`:'')+(a.status!='REQUESTED'?`<button class=s onclick="sos(${a.id})">${IC.sos}SOS</button>`:'');
  return P(ride(a)+etaTxt(a)+otpBox(a)+(S.drv?`<div class=card><div>${IC.car}${esc(S.drv.name)} · ${star(S.drv.rating,S.drv.count)}</div><div class=m>${esc([S.drv.color,S.drv.vehicle].filter(Boolean).join(' '))}${S.drv.plate?' · '+esc(S.drv.plate):''}</div></div>`:'')+`<div class=seg>${b}</div>`)}
 P(`<h2>Where to?</h2><div class=seg><button class="${S.mode=='pick'?'':'s'}" onclick="S.mode='pick';render()">Pickup</button><button class="${S.mode=='drop'?'':'s'}" onclick="S.mode='drop';render()">Drop</button></div><input id=q placeholder="Search a place, press Enter" onkeydown="if(event.key=='Enter')search(this.value)"><div class=pt><i style=background:#ff8a3d></i>${esc(S.pickN||'Pickup: tap the map or search')}</div><div class=pt><i style=background:#e11d74></i>${esc(S.dropN||'Drop: tap the map or search')}</div>${S.est?`<div class=big>₹${S.est.fare}<small>${S.est.distanceKm} km · ~${S.est.etaMin} min</small></div><button onclick=book()>Book ride</button>`:''}${hist()}`)}
function book(){const[p,d]=[S.pick,S.drop];api('/rides','POST',{pickup:S.pickN,drop:S.dropN,pLat:p[0],pLng:p[1],dLat:d[0],dLng:d[1]}).then(()=>{S.pick=S.drop=S.est=null;S.mode='pick';tick()}).catch(e=>toast(e.message))}
const sos=id=>api('/rides/'+id+'/sos','POST').then(()=>toast('SOS sent to admin')).catch(e=>toast(e.message));
// ---------- driver ----------
function driver(){const a=S.act,s=S.stat||{};const NX={ACCEPTED:'I have arrived',ARRIVED:'Start trip',STARTED:'Complete trip'};
 let h=`<div class=stats><div><small>Earnings</small><b>₹${s.earnings||0}</b></div><div><small>Trips</small><b>${s.trips||0}</b></div><div><small>Rating</small><b>${star(s.rating,s.ratingCount)}</b></div></div>`;
 if(a)h+=ride(a)+(S.rider?`<div class=card>Rider: ${esc(S.rider.name)}</div>`:'')+(S.earn!=null?`<div class=card><div class=h><span>You earn</span><b>₹${S.earn}</b></div><div class=m>from the ₹${a.fare} fare, once the rider has paid</div></div>`:'')+`<div class=seg>${a.status=='ARRIVED'?`<input id=otp inputmode=numeric maxlength=4 placeholder="4-digit code from rider"><button onclick="startTrip(${a.id})">Start trip</button>`:`<button onclick="act('/rides/${a.id}/advance')">${NX[a.status]}</button>`}${a.status!='STARTED'?`<button class=d onclick="act('/rides/${a.id}/cancel')">Cancel</button>`:''}<button class=s onclick="sos(${a.id})">${IC.sos}SOS</button></div><div class=seg><button class=s onclick=toggleDemo()>${S.demo?'Switch to real GPS':'Switch to demo drive'}</button></div><p class=m>${S.demo?'Demo drive moves your car toward the target by itself.':'Your GPS position is shared with the rider.'}</p>`;
 else h+=`<div class=seg><button class="${s.available?'':'s'}" onclick=toggle()>${s.available?'<span class=dot></span>Online':'Go online'}</button><button class=s onclick=gps()>${IC.pin}Use GPS</button></div><p class=m>Tap the map to set your location. Ride requests within 20 km appear here.</p><div class=seg><button class=s onclick=toggleDemo()>${S.demo?'Switch to real GPS':'Switch to demo drive'}</button></div>`+(S.reqs.length?S.reqs.map(r=>`<div class=card><div>${esc(r.pickup)} → ${esc(r.drop)}</div><div class=h><span>₹${r.fare} · ${r.distanceKm} km</span></div><button onclick="act('/rides/${Number(r.id)}/accept')">Accept ride</button></div>`).join(''):s.available?'<div class=card>Waiting for requests…</div>':'')+hist();
 P(h)}
function toggle(){if(!S.me)return toast('Set your location first (tap map or GPS)');api('/driver/status','POST',{lat:S.me[0],lng:S.me[1],available:!S.stat.available}).then(tick).catch(e=>toast(e.message))}
function gps(){navigator.geolocation?.getCurrentPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude];map.setView(S.me,14);api('/driver/status','POST',{lat:S.me[0],lng:S.me[1]}).then(draw)},()=>toast('GPS unavailable'))}
async function simulate(){const a=S.act;if(!S.me||!['ACCEPTED','STARTED'].includes(a.status))return;const t=a.status=='STARTED'?[a.dLat,a.dLng]:[a.pLat,a.pLng];
 S.me=[S.me[0]+(t[0]-S.me[0])*.25,S.me[1]+(t[1]-S.me[1])*.25];await api('/driver/status','POST',{lat:S.me[0],lng:S.me[1]})}
// ---------- admin ----------
const AF={u:'',r:'',s:'ALL'};let D={us:[],rs:[]};
const csv=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function exportCsv(){const h=['id','created','rider','rider_phone','driver','driver_phone','pickup','drop','km','fare','driver_gets','platform_profit','status','paid','rating'];
 const rows=D.rs.map(r=>[r.id,r.created,r.riderName,r.riderPhone,r.driverName,r.driverPhone,r.pickup,r.drop,r.distanceKm,r.fare,r.earning??'',r.profit??'',r.status,r.paid?'yes':'no',r.rating??''].map(csv).join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}));a.download='zivo-rides.csv';a.click();URL.revokeObjectURL(a.href)}
function usersTbl(){const q=AF.u.toLowerCase(),L=D.us.filter(u=>!q||(u.name+' '+u.email+' '+(u.phone||'')+' '+u.role).toLowerCase().includes(q));
 return`<table><tr><th>Name<th>Email<th>Phone<th>Role<th>Vehicle<th>Rating<th>Joined<th>Status<th></tr>${L.map(u=>`<tr><td>${esc(u.name)}<td>${esc(u.email)}<td>${esc(u.phone||'-')}<td>${esc(u.role)}<td>${esc(u.role=='DRIVER'?[u.color,u.vehicle,u.plate].filter(Boolean).join(' ')||'-':'-')}<td>${u.role=='DRIVER'?star(u.rating,u.ratingCount):'-'}<td>${fmt(u.created)}<td>${u.active?(u.role=='DRIVER'&&u.available?'<span class=dot></span>Online':'Active'):'Banned'}<td>${u.role!='ADMIN'?`<button class="${u.active?'d':''}" onclick="ban(${Number(u.id)},${!u.active})">${u.active?'Ban':'Unban'}</button>`:''}</tr>`).join('')||'<tr><td>No matching users</tr>'}</table>`}
function ridesTbl(){const q=AF.r.toLowerCase(),L=D.rs.filter(r=>(AF.s=='ALL'||r.status==AF.s)&&(!q||(r.id+' '+r.pickup+' '+r.drop+' '+r.riderName+' '+r.driverName).toLowerCase().includes(q)));
 return`<table><tr><th>#<th>Date<th>Rider<th>Driver<th>Route<th>Fare<th>Driver gets<th>Profit<th>Status<th>Paid<th>Rating<th></tr>${L.map(r=>`<tr class="${r.sos?'sos':''}"><td>${r.id}<td>${fmt(r.created)}<td>${esc(r.riderName)}<td>${esc(r.driverName||'-')}<td>${esc(r.pickup)} → ${esc(r.drop)}<td>₹${r.fare}<td>${r.paid?'₹'+r.earning:'-'}<td>${r.paid?'₹'+r.profit:'-'}<td>${esc(r.status)}${r.sos?' <b class=tag>SOS</b>':''}<td>${r.paid?'Yes':'No'}<td>${r.rating??'-'}<td><button class=s onclick="openRide(${Number(r.id)})">Details</button> ${A.includes(r.status)?`<button class=d onclick="cancelRide(${Number(r.id)})">Cancel ride</button>`:''}</tr>`).join('')||'<tr><td>No matching rides</tr>'}</table>`}
const sosBox=()=>{const L=D.rs.filter(r=>r.sos);return L.length?`<div class="glass card" style="border-color:#e11d74"><h3>Active SOS alerts</h3>${L.map(r=>`<div class=card><div><b>Ride #${r.id}</b> · ${esc(r.pickup)} → ${esc(r.drop)}</div><div class=m>Rider: ${esc(r.riderName)} ${esc(r.riderPhone||'(no phone)')} · Driver: ${esc(r.driverName||'none')} ${esc(r.driverPhone||'')}</div>${r.driverLat?`<a href="https://www.openstreetmap.org/?mlat=${Number(r.driverLat)}&amp;mlon=${Number(r.driverLng)}#map=16/${Number(r.driverLat)}/${Number(r.driverLng)}" target=_blank rel=noopener>Open the driver's last location</a>`:''}<button onclick="resolveSos(${Number(r.id)})">Mark resolved</button></div>`).join('')}</div>`:''};
async function adminView(){const ae=document.activeElement;if(ae&&['INPUT','SELECT'].includes(ae.tagName)&&ae.closest('#admin'))return;
 try{const[s,us,rs,ts,au]=await Promise.all([api('/admin/stats'),api('/admin/users'),api('/admin/rides'),api('/admin/tickets'),api('/admin/audit')]);D={us,rs};
 const n=rs.filter(r=>r.sos).length;document.title=(n?'('+n+') SOS | ':'')+'Zivo | Cab booking';
 $('#admin').hidden=false;$('#admin').innerHTML=`<div class=w><h1>Control room</h1>${sosBox()}<div class=kp>${[['Riders',s.riders],['Drivers',s.drivers],['Online drivers',s.onlineDrivers],['Active rides',s.activeRides],['Rides',s.rides],['Completed',s.completed],['Revenue','₹'+s.revenue],['Platform profit','₹'+s.platform],['Driver payouts','₹'+s.payouts],['Awaiting payment','₹'+s.pending],['Open messages',s.openTickets],['SOS alerts',s.sos]].map(x=>`<div class=glass><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div>
 <h3>Live tracking</h3><div class=glass id=lm style="padding:6px;border-radius:24px;overflow:hidden"></div>
 <h3>Users</h3><input placeholder="Search name, email, phone or role" value="${esc(AF.u)}" oninput="AF.u=this.value;$('#ut').innerHTML=usersTbl()"><div class="glass tw" id=ut>${usersTbl()}</div>
 <h3>Rides</h3><div class=seg><input placeholder="Search ride number, place or name" value="${esc(AF.r)}" oninput="AF.r=this.value;$('#rt').innerHTML=ridesTbl()"><select onchange="AF.s=this.value;$('#rt').innerHTML=ridesTbl()">${['ALL','REQUESTED','ACCEPTED','ARRIVED','STARTED','COMPLETED','CANCELLED'].map(x=>`<option ${AF.s==x?'selected':''}>${x}</option>`).join('')}</select><button class=s onclick=exportCsv()>Export CSV</button></div><div class="glass tw" id=rt>${ridesTbl()}</div>
 <h3>Support messages</h3><div class="glass tw"><table><tr><th>#<th>From<th>Message<th>Status<th>Reply</tr>${ts.map(x=>`<tr><td>${x.id}<td>${esc(x.userName)}<td><b>${esc(x.subject)}</b><br>${esc(x.message)}<td>${esc(x.status)}<td>${x.status=='OPEN'?`<input id=rp${Number(x.id)} placeholder="Reply" maxlength=1000><button onclick="closeT(${Number(x.id)})">Reply and close</button>`:esc(x.reply||'')}</tr>`).join('')||'<tr><td>No messages</tr>'}</table></div>
 <h3>Admin activity</h3><div class="glass tw"><table><tr><th>When<th>Admin<th>Action<th>Detail</tr>${au.map(a=>`<tr><td>${new Date(a.created).toLocaleString()}<td>${esc(a.admin)}<td>${esc(a.action)}<td>${esc(a.detail)}</tr>`).join('')||'<tr><td>No actions yet</tr>'}</table></div></div>`;liveMap()}catch(e){}}
const cancelRide=id=>{if(confirm('Cancel ride #'+id+'?'))api('/admin/rides/'+id+'/cancel','POST').then(()=>{adminView();if(DMap)refreshRide(id)}).catch(e=>toast(e.message))};
const resolveSos=id=>api('/admin/rides/'+id+'/sos/resolve','POST').then(()=>{adminView();if(DMap)refreshRide(id)}).catch(e=>toast(e.message));
const ban=(id,a)=>api('/admin/users/'+id+'/active','POST',{active:a}).then(adminView).catch(e=>toast(e.message));
// ---------- profile and help ----------
const fmt=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const FAQ={RIDER:[['What is the trip code?','When a driver accepts, you get a 4-digit code. Tell it to the driver when they arrive. The trip starts only after the driver enters it.'],['How do I book a ride?','Choose Pickup or Drop, then tap the map or search for a place. When both are set the fare appears. Press Book ride.'],['How is the fare worked out?','From the estimated road distance between pickup and drop. You see it before you book, and the booked fare is what you pay.'],['Can I cancel?','Yes, from the ride panel until the trip starts.'],['How do I pay?','When the trip is complete, press Pay in the ride panel. After that you can rate the driver.'],['What does SOS do?','It alerts Zivo admins with your ride number. It does not call the police or an ambulance. In an emergency call your local emergency number first (112 in India).'],['Why does a driver show New?','They have not received a rating yet.']],
 DRIVER:[['How do I start a trip?','At the pickup press I have arrived. Then ask the rider for their 4-digit trip code and enter it to start the trip.'],['How do I get ride requests?','Add your vehicle details in Profile, set your location (tap the map or use GPS), then press Go online. Requests within 20 km appear in the panel.'],['Why can I not go online?','Your vehicle name and number plate must be filled in on your profile, and your location must be set.'],['How are earnings worked out?','You receive 80% of each completed fare. The total is on your profile.'],['What does SOS do?','It alerts Zivo admins with your ride number. It does not call emergency services. In an emergency call your local emergency number first.']],ADMIN:[]};
const sheet=(h,w)=>{const s=$('#sheet');s.hidden=false;s.innerHTML='<div class="glass box"'+(w?' style="width:'+w+'px"':'')+'>'+h+'</div>';s.onclick=e=>{if(e.target.id=='sheet')closeSheet()}};
const closeSheet=()=>{$('#sheet').hidden=true;clearInterval(RT);if(DMap){DMap.remove();DMap=null}};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});
async function profile(){try{const m=await api('/me'),u=m.user,D=u.role=='DRIVER';
 sheet(`<div style="display:flex;gap:14px;align-items:center"><div class=av>${esc(u.name.charAt(0).toUpperCase())}</div><div><h2>${esc(u.name)}</h2><p class=m>${esc(u.email)} · ${esc(u.role)} · Member since ${fmt(u.created)}</p></div></div>
 ${u.role=='ADMIN'?'':`<div class=stats><div><small>${D?'Trips':'Rides'}</small><b>${D?m.completed:m.rides}</b></div><div><small>${D?'Earnings':'Spent'}</small><b>₹${m.amount}</b></div><div><small>${D?'Rating':'Completed'}</small><b>${D?star(u.rating,u.ratingCount)+(u.ratingCount?' ('+u.ratingCount+')':''):m.completed}</b></div></div>`}
 <h3>Details</h3><label class=f>Name<input id=pn maxlength=60 value="${esc(u.name)}"></label><label class=f>Phone (optional, visible to admins only)<input id=pp maxlength=18 value="${esc(u.phone||'')}"></label>
 ${D?`<div class=row2><label class=f>Vehicle<input id=pv maxlength=40 value="${esc(u.vehicle||'')}" placeholder="e.g. Maruti Swift"></label><label class=f>Colour<input id=pc maxlength=20 value="${esc(u.color||'')}"></label></div><label class=f>Number plate<input id=pl maxlength=15 value="${esc(u.plate||'')}" placeholder="e.g. OD 02 AB 1234"></label>`:''}
 <button onclick=saveProfile()>Save details</button>
 <h3>Change password</h3><input id=cp type=password placeholder="Current password"><input id=np type=password placeholder="New password (8+ characters)"><button class=s onclick=savePass()>Change password</button><button class=s onclick=closeSheet()>Close</button>`)}catch(e){toast(e.message)}}
function saveProfile(){const b={name:$('#pn').value,phone:$('#pp').value};if($('#pv')){b.vehicle=$('#pv').value;b.color=$('#pc').value;b.plate=$('#pl').value}
 api('/me','POST',b).then(u=>{U=u;sessionStorage.u=JSON.stringify(U);topbar();toast('Profile saved');tick()}).catch(e=>toast(e.message))}
function savePass(){api('/me/password','POST',{current:$('#cp').value,password:$('#np').value}).then(j=>{T=j.token;U=j.user;sessionStorage.t=T;sessionStorage.u=JSON.stringify(U);$('#cp').value=$('#np').value='';toast('Password changed. Other devices are logged out.');if(ws)ws.deactivate();connect()}).catch(e=>toast(e.message))}
async function help(){let t=[];if(U.role!='ADMIN'){try{t=await api('/tickets')}catch{}}
 sheet(`<h2>Help</h2>${(FAQ[U.role]||[]).length?'<h3>Common questions</h3>':''}${(FAQ[U.role]||[]).map(q=>`<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}
 ${U.role=='ADMIN'?'':`<h3>Contact support</h3><input id=ts maxlength=80 placeholder="Subject"><textarea id=tm maxlength=1000 placeholder="Describe the problem. If it is about a ride, include the ride number."></textarea><button onclick=sendTicket()>Send message</button>${t.length?'<h3>Your messages</h3>'+t.map(x=>`<div class=card><b>${esc(x.subject)}</b><div class=m>${esc(x.message)}</div><div class=h><span>${esc(x.status)} · ${fmt(x.created)}</span></div>${x.reply?`<div>Reply: ${esc(x.reply)}</div>`:''}</div>`).join(''):''}`}
 <p class=m><a href=/privacy.html target=_blank rel=noopener>Privacy Policy</a> · <a href=/terms.html target=_blank rel=noopener>Terms</a></p><button class=s onclick=closeSheet()>Close</button>`)}
function sendTicket(){api('/tickets','POST',{subject:$('#ts').value,message:$('#tm').value}).then(()=>{toast('Message sent');help()}).catch(e=>toast(e.message))}
const closeT=id=>api('/admin/tickets/'+id+'/close','POST',{reply:$('#rp'+id).value}).then(adminView).catch(e=>toast(e.message));
// ---------- live tracking, trip code, alerts ----------
const hv=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const etaTxt=a=>{if(!S.drv||!S.drv.lat)return'';const t=a.status=='STARTED'?[a.dLat,a.dLng]:a.status=='ACCEPTED'?[a.pLat,a.pLng]:null;if(!t)return'';
 const m=Math.max(1,Math.round(hv(S.drv.lat,S.drv.lng,t[0],t[1])*1.3*2)),age=S.drv.at?Math.round((Date.now()-new Date(S.drv.at))/1000):null;
 return`<div class=m>${a.status=='STARTED'?'About '+m+' min to the drop':'Driver is about '+m+' min away'}${age!==null?' · '+(age<15?'live':'updated '+age+'s ago'):''}</div>`};
const otpBox=a=>S.otp&&['ACCEPTED','ARRIVED'].includes(a.status)?`<div class=card><small class=m>Trip code. Tell it to your driver to start the trip.</small><div class=big style="letter-spacing:10px">${esc(S.otp)}</div></div>`:'';
const startTrip=id=>act('/rides/'+id+'/advance','POST',{otp:$('#otp').value});
let gw=null;
function startGps(){if(gw!==null||!navigator.geolocation)return;gw=navigator.geolocation.watchPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude]},()=>{toast('GPS unavailable, switched to demo drive');S.demo=true;stopGps();render()},{enableHighAccuracy:true,maximumAge:2000})}
function stopGps(){if(gw!==null){navigator.geolocation.clearWatch(gw);gw=null}}
function toggleDemo(){S.demo=!S.demo;S.demo?stopGps():startGps();render()}
const RN={ACCEPTED:['Driver accepted','A driver is on the way to your pickup.'],ARRIVED:['Your driver has arrived','Tell the driver your trip code to start.'],STARTED:['Trip started','Have a safe ride.'],COMPLETED:['You have arrived','Please pay for your trip.'],CANCELLED:['Ride cancelled','This ride was cancelled.']};
const DN={CANCELLED:['Ride cancelled','This ride was cancelled.']};
function notify(t,b){toast(t+'. '+b,6000);if('Notification' in window&&Notification.permission=='granted'){try{new Notification(t,{body:b})}catch{}}}
function detect(){const D=U.role=='DRIVER',M=D?DN:RN;
 for(const r of S.mine){const p=S.prev[r.id];if(p&&p!=r.status&&M[r.status])notify(M[r.status][0],M[r.status][1]);S.prev[r.id]=r.status}
 if(D){const n=S.reqs.length;if(S.reqN!==undefined&&n>S.reqN)notify('New ride request','A rider nearby needs a driver.');S.reqN=n}}
const enableAlerts=()=>Notification.requestPermission().then(p=>{topbar();toast(p=='granted'?'Alerts are on':'Alerts are blocked in your browser settings')});
// ---------- admin ride details and live tracking ----------
let LM=null,LG=null,DMap=null,DG=null,RT=null;
const tiles=()=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19});
const liveEl=document.createElement('div');liveEl.style.cssText='height:340px;border-radius:18px;overflow:hidden';
const cm=(p,c,r,tip,fn)=>{const m=L.circleMarker(p,{radius:r,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).bindTooltip(esc(tip));if(fn)m.on('click',fn);return m};
function liveMap(){const ph=$('#lm');if(!ph)return;if(!LM){LM=L.map(liveEl).setView([20.2961,85.8245],11);tiles().addTo(LM);LG=L.layerGroup().addTo(LM)}
 if(liveEl.parentNode!==ph)ph.appendChild(liveEl);LM.invalidateSize();LG.clearLayers();const pts=[],busy=new Set();
 D.rs.filter(r=>['ACCEPTED','ARRIVED','STARTED'].includes(r.status)&&r.driverId).forEach(r=>{const u=D.us.find(x=>x.id==r.driverId);if(!u||!(u.lat||u.lng))return;busy.add(u.id);
  const p=[u.lat,u.lng],t=r.status=='STARTED'?[r.dLat,r.dLng]:[r.pLat,r.pLng];
  L.polyline([p,t],{color:'#ff8a3d',weight:2,dashArray:'4 6'}).addTo(LG);cm(t,'#e11d74',5,(r.status=='STARTED'?'Drop':'Pickup')+' for ride #'+r.id).addTo(LG);
  cm(p,'#ff8a3d',10,'Ride #'+r.id+' · '+r.driverName+' · '+r.status,()=>openRide(r.id)).addTo(LG);pts.push(p,t)});
 D.us.filter(u=>u.role=='DRIVER'&&u.active&&u.available&&(u.lat||u.lng)&&!busy.has(u.id)).forEach(u=>{const p=[u.lat,u.lng];cm(p,'#fbf3ff',7,u.name+' · online, free').addTo(LG);pts.push(p)});
 D.rs.filter(r=>r.status=='REQUESTED').forEach(r=>{const p=[r.pLat,r.pLng];cm(p,'#e11d74',7,'Waiting: ride #'+r.id,()=>openRide(r.id)).addTo(LG);pts.push(p)});
 if(pts.length&&!LM._fit){LM._fit=true;LM.fitBounds(pts,{padding:[40,40],maxZoom:15})}}
const dur=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/60000))+' min':'-',tm=v=>v?new Date(v).toLocaleString():'-';
const row=(a,b)=>`<div class=h><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
function rideDetail(x){const r=x.ride,d=x.driver,p=x.rider,tr=x.track,live=d&&['ACCEPTED','ARRIVED','STARTED'].includes(r.status);
 const tl=[['Requested',r.created],['Driver accepted',r.acceptedAt],['Driver arrived',r.arrivedAt],['Trip started',r.startedAt],['Trip completed',r.completed],['Cancelled'+(r.cancelledBy?' by '+r.cancelledBy:''),r.cancelledAt]].filter(t=>t[1]);
 return`<div class=seg style="flex-wrap:nowrap"><span class=tag>${esc(r.status)}</span>${r.sos?'<span class=tag>SOS ACTIVE</span>':''}</div>
 <h3>Timeline</h3>${tl.map(t=>row(t[0],tm(t[1]))).join('')}${row('Time to accept',dur(r.created,r.acceptedAt))}${row('Trip duration',dur(r.startedAt,r.completed))}
 <h3>Trip</h3><div class=pt>${esc(r.pickup)}</div><div class=pt>${esc(r.drop)}</div>${row('Distance',r.distanceKm+' km')}${row('Pickup coordinates',r.pLat.toFixed(5)+', '+r.pLng.toFixed(5))}${row('Drop coordinates',r.dLat.toFixed(5)+', '+r.dLng.toFixed(5))}
 <h3>People</h3><div class=card><b>Rider</b>${p?`<div class=m>${esc(p.name)} · ${esc(p.email)} · ${esc(p.phone||'no phone')}</div>`:'<div class=m>Unknown</div>'}</div>
 <div class=card><b>Driver</b>${d?`<div class=m>${esc(d.name)} · ${esc(d.email)} · ${esc(d.phone||'no phone')}</div><div class=m>${esc([d.color,d.vehicle,d.plate].filter(Boolean).join(' ')||'No vehicle details')} · ${star(d.rating,d.ratingCount)}</div>`:'<div class=m>Not assigned yet</div>'}</div>
 <h3>Money</h3>${row('Fare','₹'+r.fare)}${row('Payment',r.paid?'Paid':r.status=='COMPLETED'?'Awaiting payment':'Not due yet')}${row('Driver gets','₹'+x.driverShare+(r.paid?'':' (after payment)'))}${row('Platform profit',r.paid?'₹'+x.profit:'-')}${row('Rider rating',r.rating??'-')}
 <h3>Tracking</h3>${row('Route points recorded',tr.length)}${tr.length?row('First point',tm(tr[0].at))+row('Latest point',tm(tr[tr.length-1].at)):''}${live&&d.at?row('Driver last seen',Math.round((Date.now()-new Date(d.at))/1000)+'s ago'):''}
 ${live&&(d.lat||d.lng)?`<a href="https://www.openstreetmap.org/?mlat=${Number(d.lat)}&amp;mlon=${Number(d.lng)}#map=16/${Number(d.lat)}/${Number(d.lng)}" target=_blank rel=noopener>Open the driver's position</a>`:''}
 <div class=seg>${A.includes(r.status)?`<button class=d onclick="cancelRide(${Number(r.id)})">Cancel ride</button>`:''}${r.sos?`<button onclick="resolveSos(${Number(r.id)})">Mark resolved</button>`:''}<button class=s onclick=closeSheet()>Close</button></div>`}
async function rideMapDraw(x,first){const r=x.ride,a=[r.pLat,r.pLng],b=[r.dLat,r.dLng],line=await rt(a,b);if(!DMap)return;DG.clearLayers();
 L.polyline(line,{color:'#ff8a3d',weight:4,opacity:.5}).addTo(DG);const tr=x.track.map(p=>[p.lat,p.lng]);if(tr.length>1)L.polyline(tr,{color:'#fbf3ff',weight:3,dashArray:'6 6'}).addTo(DG);
 cm(a,'#ff8a3d',8,'Pickup').addTo(DG);cm(b,'#e11d74',8,'Drop').addTo(DG);const d=x.driver;
 if(d&&(d.lat||d.lng)&&['ACCEPTED','ARRIVED','STARTED'].includes(r.status))cm([d.lat,d.lng],'#fbf3ff',10,'Driver, live').addTo(DG);
 if(first)DMap.fitBounds([a,b,...tr],{padding:[30,30]})}
async function refreshRide(id){try{const x=await api('/admin/rides/'+id);if(!DMap)return;$('#dd').innerHTML=rideDetail(x);rideMapDraw(x,false);if(!A.includes(x.ride.status))clearInterval(RT)}catch(e){}}
async function openRide(id){try{clearInterval(RT);if(DMap){DMap.remove();DMap=null}const x=await api('/admin/rides/'+id);
 sheet(`<h2>Ride #${Number(x.ride.id)}</h2><div id=dm style="height:280px;border-radius:18px;overflow:hidden"></div><div id=dd>${rideDetail(x)}</div>`,720);
 DMap=L.map('dm').setView([x.ride.pLat,x.ride.pLng],13);tiles().addTo(DMap);DG=L.layerGroup().addTo(DMap);rideMapDraw(x,true);
 if(A.includes(x.ride.status))RT=setInterval(()=>refreshRide(id),3000)}catch(e){toast(e.message)}}
// ---------- engine ----------
const render=()=>!U?authView():U.role=='DRIVER'?driver():rider();
function sub(d){if(d&&ws&&ws.connected&&!subs[d])subs[d]=ws.subscribe(d,()=>U.role=='ADMIN'?adminView():tick())}
function connect(){ws=new StompJs.Client({brokerURL:(location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws',connectHeaders:{Authorization:'Bearer '+T},reconnectDelay:5000,onConnect:()=>{subs={};sub(U.role=='DRIVER'?'/topic/requests':U.role=='ADMIN'?'/topic/admin':null)}});ws.activate()}
async function tick(){try{S.mine=await api('/rides/mine');const D=U.role=='DRIVER';
 S.act=S.mine.find(r=>A.includes(r.status)||(!D&&r.status=='COMPLETED'&&(!r.paid||r.rating==null)&&!S.skip.has(r.id)))||null;S.drv=S.rider=S.otp=S.earn=null;
 if(S.act&&S.act.driverId){const d=await api('/rides/'+S.act.id);S.drv=d.driver;S.rider=d.rider||null;S.otp=d.otp||null;S.earn=d.earning??null;S.act=d.ride}
 if(D){S.stat=await api('/driver/stats');if(!S.me&&(S.stat.lat||S.stat.lng))S.me=[S.stat.lat,S.stat.lng];S.reqs=!S.act&&S.stat.available?await api('/driver/requests'):[];if(!S.demo&&S.me&&(S.act||S.stat.available))await api('/driver/status','POST',{lat:S.me[0],lng:S.me[1]});if(S.act&&S.demo)await simulate()}
 if(S.act)sub('/topic/ride/'+S.act.id);
 detect();const g=JSON.stringify([U.role=='RIDER'&&S.drv?[Math.round(S.drv.lat*1e4),Math.round(S.drv.lng*1e4)]:0,S.mine.map(r=>[r.id,r.status,r.paid,r.rating]),S.reqs.map(r=>r.id),S.stat&&[S.stat.earnings,S.stat.trips,S.stat.available,S.stat.rating],S.skip.size]);if(g!=sig){sig=g;render()}draw()}catch(e){}}
function topbar(){$('#top').innerHTML='<div class="logo glass pad"><svg width="24" height="24" viewBox="0 0 64 64" style="vertical-align:-6px;margin-right:8px"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#e11d74"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M37 7L17 35h12l-4 22 22-30H34l7-20z" fill="#fff"/></svg>ziv<i>o</i></div>'+(U?`<div class="glass pad">${esc(U.name)} · ${esc(U.role)} <button class=s onclick=profile()>Profile</button><button class=s onclick=help()>Help</button>${'Notification' in window&&Notification.permission=='default'?'<button class=s onclick=enableAlerts()>Turn on alerts</button>':''}<button class=s onclick=logout()>Log out</button></div>`:'');}topbar();
if(!U)authView();else if(U.role=='ADMIN'){$('#panel').hidden=true;connect();adminView();setInterval(adminView,6000)}
else{render();connect();tick();setInterval(tick,3000);navigator.geolocation?.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],13))}
</script></body></html>
