# Default = local H2 file DB. For PostgreSQL/Supabase set DB_URL, DB_USER, DB_PASS env vars.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cab}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jackson.visibility.field=any
server.error.include-stacktrace=never
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:}
server.forward-headers-strategy=framework

# Optional production integrations. Stripe remains disabled until a secret key is configured.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.public-url=${PUBLIC_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
